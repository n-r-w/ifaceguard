name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-standalone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6.2.0
        with:
          go-version: "1.25"
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-custom-gcl:
    needs: release-standalone
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6.2.0
        with:
          go-version: "1.25"
          cache: true

      - name: Set golangci-lint version
        run: echo "GOLANGCI_VERSION=$(cat .golangci-version)" >> "$GITHUB_ENV"

      - name: Install golangci-lint
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_VERSION}

      - name: Build custom golangci-lint
        working-directory: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p ../bin
          BIN_NAME="custom-gcl_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BIN_NAME="${BIN_NAME}.exe"
          fi
          golangci-lint custom --version "${GOLANGCI_VERSION}" --name "${BIN_NAME}" --destination ./../bin/
          echo "BIN_PATH=bin/${BIN_NAME}" >> "$GITHUB_ENV"

      - name: Upload custom golangci-lint to release
        uses: softprops/action-gh-release@v2.5.0
        with:
          files: ${{ env.BIN_PATH }}
