name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.2.0
        with:
          go-version: '1.26'
          cache: true

      - name: Set golangci-lint version
        run: echo "GOLANGCI_VERSION=$(cat .golangci-version)" >> "$GITHUB_ENV"

      - name: Install golangci-lint
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_VERSION}

      - name: Set up task
        uses: go-task/setup-task@v1.0.0

      - name: Lint
        run: task lint

      - name: Test
        run: task test

      - name: Build
        run: task build

      - name: Upload artifacts
        uses: actions/upload-artifact@v6.0.0
        with:
          name: ifaceguard-${{ github.sha }}
          path: |
            bin/ifaceguard
            bin/custom-gcl
