version: 2

project_name: ifaceguard

builds:
  - id: ifaceguard
    main: ./cmd/ifaceguard
    binary: ifaceguard
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: ifaceguard
    ids:
      - ifaceguard
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

release:
  draft: false
