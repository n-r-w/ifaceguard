version: "2"
run:
  issues-exit-code: 1
  tests: true
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
linters:
  default: none
  enable:
    - ifaceguard
  settings:
    custom:
      ifaceguard:
        type: module
        settings:
          assertions:
            requireassertions: true
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
